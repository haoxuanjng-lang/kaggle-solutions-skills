name: Publish skill package
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-skill-package
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@haoxuanjng-lang"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python scripts/project.py check
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - name: Verify release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$tag" ]; then
            echo "Release tag must match package version" >&2
            exit 1
          fi
          gh release view "$tag"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PACKAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Build downloadable packages
        run: |
          python scripts/project.py package
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum *.zip *.tgz > SHA256SUMS.txt
      - name: Publish npm package to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if npm view "@haoxuanjng-lang/kaggle-solutions-skills@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com; then
            echo "Package version already published"
          else
            npm publish "dist/haoxuanjng-lang-kaggle-solutions-skills-$PACKAGE_VERSION.tgz" --registry=https://npm.pkg.github.com --access public --ignore-scripts
          fi
      - name: Attach public downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$PACKAGE_TAG" dist/*.zip dist/*.tgz dist/SHA256SUMS.txt --clobber
