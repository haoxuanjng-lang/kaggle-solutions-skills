name: Review upstream archive
on:
  schedule:
    - cron: "0 1 * * 1" # Monday 09:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: archive-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/sync_upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
