name: Daily maintenance
on:
  schedule:
    - cron: "0 1 * * *" # Daily 09:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install -e .
      - name: Check skill, package and real-competition research scenarios
        run: python scripts/daily_maintenance.py --output cache/daily-maintenance
      - name: Retain maintenance summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-maintenance-${{ github.run_id }}
          path: cache/daily-maintenance/
          if-no-files-found: warn
          retention-days: 14
