[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-solutions-skills"
version = "0.2.2"
description = "Evidence-backed Kaggle solution research and maintained agent skill"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]
license = {text = "MIT"}

[project.optional-dependencies]
kaggle-read = ["httpx>=0.27,<1", "kaggle>=2.2.3,<3"]

[tool.setuptools]
py-modules = []
